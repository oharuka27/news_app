<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ニュースまとめ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1>ニュースまとめ</h1>
    <nav id="tabs" class="tabs" role="tablist" aria-label="テーマ"></nav>
  </header>
  <main class="main" id="panel" role="tabpanel">
    <div class="toolbar">
      <label id="translate-toggle" class="toggle" hidden>
        <input id="translate" type="checkbox">
        日本語に翻訳（DeepL）
      </label>
      <button id="reload" class="button" type="button">再読み込み</button>
    </div>
    <p id="notice" class="notice" hidden></p>
    <p id="status" class="status">読み込み中…</p>
    <ol id="news-list" class="news-list"></ol>
  </main>
  <script src="app.js"></script>
</body>
</html>
