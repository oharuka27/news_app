<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ニュースまとめ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1>ニュースまとめ</h1>
    <nav id="tabs" class="tabs" role="tablist" aria-label="テーマ"></nav>
  </header>
  <main class="main" id="panel" role="tabpanel">
    <form id="custom-form" class="custom-form" hidden>
      <input id="custom-query" class="custom-query" type="search" maxlength="100"
             placeholder="キーワード（例: 半導体、Apple、円安）" aria-label="検索キーワード" required>
      <select id="custom-lang" class="custom-lang" aria-label="検索する言語">
        <option value="ja">日本語ニュース</option>
        <option value="en">英語ニュース</option>
      </select>
      <button class="button button-primary" type="submit">検索</button>
    </form>
    <div id="toolbar" class="toolbar">
      <label id="translate-toggle" class="toggle" hidden>
        <input id="translate" type="checkbox">
        日本語に翻訳（DeepL）
      </label>
      <button id="reload" class="button" type="button">再読み込み</button>
    </div>
    <p id="notice" class="notice" hidden></p>
    <p id="status" class="status">読み込み中…</p>
    <ol id="news-list" class="news-list"></ol>
  </main>
  <script src="read-later.js"></script>
  <script src="app.js"></script>
</body>
</html>
